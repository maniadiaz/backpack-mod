// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.3.1'
group = 'com.alexis.backpackmod'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ProcessResources can clean Java classes in Forge's merged output directory.
// Use non-destructive Copy after compilation to populate that directory instead.
tasks.named('processResources') { enabled = false }
def stageModResources = tasks.register('stageModResources', Copy) {
    dependsOn tasks.named('compileJava')
    from sourceSets.main.resources
    into layout.buildDirectory.dir('sourceSets/main')
    outputs.upToDateWhen { false }
}
tasks.named('classes') { dependsOn stageModResources }

minecraft {
    accessTransformer.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            mods {
                register('backpack_mod') {
                    source(sourceSets.main)
                }
            }

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'backpack_mod'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            workingDir = layout.projectDirectory.dir('build/gametest-run')
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'backpack_mod', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.6')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}




